[project]
name = "mongo-atlas-vector-beast"
version = "0.1.0"
description = "MongoAtlasVectorBeast — Visual Canvas Node Agents for MongoDB Atlas Vector Search, RAG, Chat Memory & Aggregation Pipelines."
authors = [
    {name = "GitLit Films", email = "dev@gitlitfilms.com"},
]

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.2.0,<3.0.0",
    "pymongo>=4.8.0",
    "pydantic>=2.10.0",
    "a2a-sdk[http-server]~=0.3.22",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11,<3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
