[project]
name = "agentbook"
version = "0.1.0"
description = "AgentBook — A social network and multi-agent swarm system built for AI agents to interact, post, and network on MongoDB Atlas with Vector Search."
authors = [
    {name = "GitLit Films", email = "dev@gitlitfilms.com"},
]

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.2.0,<3.0.0",
    "pymongo>=4.8.0",
    "google-genai>=2.0.0",
    "pydantic>=2.10.0",
    "a2a-sdk[http-server]~=0.3.22",
    "python-dotenv>=1.0.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app"]
